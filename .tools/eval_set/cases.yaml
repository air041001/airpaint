# AirPaint Prompt Engine Evaluation Set (Phase 0)
# 30 条覆盖各类别的中文输入, 用于 Prompt Engine 回归测试
# 第一层(结构回归): 跑 run_baseline.py 记录 prompt_en + breakdown, 不生图
# 第二层(生图): 选 5-10 条固定 seed 生图, 手动验收视觉质量
# 用法: 改 Prompt Engine 后重跑, 对比 baseline 是否退化

categories:
  - single_character   # 单角色 (含 char_dict 命中/未命中)
  - character_clothing # 角色 + 服装
  - scene              # 场景
  - complex_action     # 复杂动作
  - pose               # 姿态
  - multi_character    # 多人物关系
  - composition        # 构图
  - lighting           # 光影
  - style              # 风格
  - vague              # 模糊/抽象描述

cases:
  # === 单角色 (5) ===
  - id: 001
    category: single_character
    input: "甘雨站在望舒客栈的阳台上"
    notes: "char_dict 命中 ganyu, 测角色锁定 + 场景"
  - id: 002
    category: single_character
    input: "天宫心在神社前微笑"
    notes: "char_dict 命中 amamiya_kokoro (D30修正后), 测蓝发巫女形象锁定"
  - id: 003
    category: single_character
    input: "粉发的少女在海边"
    notes: "char_dict 未命中, 测 LLM 对原创角色的属性翻译"
  - id: 004
    category: single_character
    input: "噶呜·古拉在水下游泳"
    notes: "char_dict 命中 gawr_gura, 测角色 + 动作"
  - id: 005
    category: single_character
    input: "芙宁娜在法庭上审判"
    notes: "char_dict 命中 furina, 测角色 + 场景 + 氛围"

  # === 角色 + 服装 (3) ===
  - id: 006
    category: character_clothing
    input: "甘雨穿着婚纱站在花丛中"
    notes: "测角色 + 非默认服装"
  - id: 007
    category: character_clothing
    input: "天宫心穿着巫女服清扫神社"
