# Human labels reconstructed from the Phase 1.5 review conversation.
# Empty failures means no material failure was reported for that image.
experiments:
  - id: phase1_5_first_round
    cases:
      R1:
        V1: {verdict: pass, failures: []}
        V2: {verdict: pass, failures: []}
        V3: {verdict: pass, failures: []}
        V4: {verdict: pass, failures: []}
      R2:
        V1: {verdict: pass, failures: []}
        V2: {verdict: pass, failures: []}
        V3: {verdict: pass, failures: []}
        V4: {verdict: pass, failures: []}
        V5: {verdict: pass, failures: []}
      R3:
        V1: {verdict: pass, failures: []}
        V2: {verdict: fail, failures: [anatomy_nsfw, action_pose], note: "腿部人体关系错误"}
        V3: {verdict: pass, failures: []}
        V4: {verdict: fail, failures: [action_pose], note: "动作与输入不符"}
      R4:
        V1: {verdict: fail, failures: [model_artifact, spatial_composition, interaction_relation], note: "上下分页且没有稳定的后撤关系"}
        V2: {verdict: fail, failures: [model_artifact, interaction_relation], note: "举盾清楚但对抗/后撤不成立"}
        V3: {verdict: fail, failures: [model_artifact, spatial_composition, interaction_relation], note: "分页/关系不成立"}
        V4: {verdict: fail, failures: [model_artifact, spatial_composition, interaction_relation], note: "上下分页且对峙关系不稳定"}
        V5: {verdict: fail, failures: [model_artifact, spatial_composition, interaction_relation], note: "中央黑线且关系不成立"}
      R5:
        V1: {verdict: pass, failures: []}
        V2: {verdict: pass, failures: []}
        V3: {verdict: fail, failures: [lighting_style], note: "过暗，脸部细节消失"}
        V4: {verdict: fail, failures: [lighting_style], note: "过暗，脸部细节消失"}
      R6:
        V1: {verdict: pass, failures: []}
        V2: {verdict: fail, failures: [anatomy_nsfw, action_pose], note: "手部动作不清楚"}
        V3: {verdict: fail, failures: [anatomy_nsfw, action_pose], note: "手部动作不清楚"}
        V4: {verdict: fail, failures: [anatomy_nsfw, action_pose], note: "手部动作不清楚"}
      R7:
        V1: {verdict: pass, failures: []}
        V2: {verdict: pass, failures: []}
        V3: {verdict: fail, failures: [model_artifact, spatial_composition], note: "中央黑线分页"}
        V4: {verdict: pass, failures: []}
  - id: r4_second_seed
    cases:
      R4B:
        V1: {verdict: fail, failures: [interaction_relation], note: "连续画面但没有后撤，右侧同时持剑和盾"}
        V2: {verdict: fail, failures: [interaction_relation], note: "连续画面但双方都向前冲，没有后撤"}
        V3: {verdict: fail, failures: [model_artifact, anatomy_nsfw, action_pose, interaction_relation], note: "竖向黑线、人体/武器错位且没有后撤"}
        V4: {verdict: fail, failures: [model_artifact, anatomy_nsfw, action_pose, interaction_relation], note: "上下分页、人体/武器错位且没有后撤"}
        V5: {verdict: fail, failures: [model_artifact, anatomy_nsfw, action_pose, interaction_relation], note: "上下分页、人体/武器错位且没有后撤"}
  # Phase 2.6 labels decoded from the blind A/B/C review.
  # expansion_plausibility is a quality dimension; over_invention is a failure label.
  - id: phase2_5_expansion
    status: reviewed
    cases:
      E1:
        A1: {verdict: fail, failures: [style_artifact], quality: {expansion_plausibility: weak}, note: "盲位 C，一眼 AI 画风"}
        A2: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 A，与 A3 各有特色"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 B，与 A2 各有特色"}
      E2:
        A1: {verdict: review, failures: [], quality: {expansion_plausibility: neutral}, note: "盲位 A"}
        A2: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 B，细节明显胜出"}
        A3: {verdict: review, failures: [], quality: {expansion_plausibility: good}, note: "盲位 C，也不错但细节少于 A2"}
      E3:
        A1: {verdict: review, failures: [], quality: {expansion_plausibility: weak}, note: "盲位 B，平平无奇"}
        A2: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 A，明显胜出"}
        A3: {verdict: review, failures: [], quality: {expansion_plausibility: weak}, note: "盲位 C，平平无奇"}
      E4:
        A1: {verdict: fail, failures: [lighting_style], quality: {expansion_plausibility: weak}, note: "盲位 B，可看但女孩只有剪影轮廓，没有人物细节"}
        A2: {verdict: fail, failures: [lighting_style], quality: {expansion_plausibility: weak}, note: "盲位 C，整体不可接受"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 A，胜出"}
      E5:
        A1: {verdict: fail, failures: [spatial_composition], quality: {expansion_plausibility: weak}, note: "盲位 A，实际变成只有眼睛的特写"}
        A2: {verdict: fail, failures: [style_artifact], quality: {expansion_plausibility: good}, note: "盲位 C，有细节但 AI 画风明显"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 B，胜出"}
      E6:
        A1: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 B，与 A3 平局，色气程度好"}
        A2: {verdict: review, failures: [], quality: {expansion_plausibility: weak}, note: "盲位 C，整体一般，没有诱惑力"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 A，与 A1 平局，色气程度好"}
      E7:
        A1: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 C，与 A3 都很好"}
        A2: {verdict: fail, failures: [spatial_composition], quality: {expansion_plausibility: weak}, note: "盲位 B，画面被缩在很小的空间内"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 A，与 A1 都很好"}
  - id: phase2_6_tie_seed
    status: reviewed
    cases:
      E1:
        A1: {verdict: review, failures: [], quality: {expansion_plausibility: neutral}, note: "盲位 C，未进入并列优胜"}
        A2: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 A，与 A3 都很好"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 B，与 A2 都很好"}
      E6:
        A1: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 A，画出了人体"}
        A2: {verdict: fail, failures: [spatial_composition], quality: {expansion_plausibility: weak}, note: "盲位 B，过于注重场景，没有画出人体"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 C，画出了人体"}
      E7:
        A1: {verdict: fail, failures: [semantic_misread], quality: {expansion_plausibility: weak}, note: "盲位 B，纯场景描写，孤独场景也未成立"}
        A2: {verdict: fail, failures: [spatial_composition], quality: {expansion_plausibility: weak}, note: "盲位 A，内容只占画面很小部分，其余大片黑"}
        A3: {verdict: pass, failures: [], quality: {expansion_plausibility: strong}, note: "盲位 C，胜出"}
  - id: phase2_6_production_v5
    status: reviewed
    cases:
      E1:
        old: {verdict: review, failures: [], note: "盲位 B"}
        new: {verdict: pass, failures: [], note: "盲位 A，胜出"}
      E2:
        old: {verdict: review, failures: [], note: "盲位 A"}
        new: {verdict: pass, failures: [], note: "盲位 B，胜出"}
      E4:
        old: {verdict: review, failures: [], note: "盲位 B"}
        new: {verdict: pass, failures: [], note: "盲位 A，胜出"}
      E6:
        old: {verdict: pass, failures: [], note: "盲位 A，与 new 平局"}
        new: {verdict: pass, failures: [], note: "盲位 B，与 old 平局"}
      E7:
        old: {verdict: pass, failures: [], note: "盲位 A，与 new 平局"}
        new: {verdict: pass, failures: [], note: "盲位 B，与 old 平局"}
