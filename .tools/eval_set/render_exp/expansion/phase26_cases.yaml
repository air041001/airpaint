  - id: E5
    category: camera_composition
    input: "女孩脸部的特写"
    detailed_input: "我想要女孩脸部的近距离特写，只保留头部和肩膀附近的画面。她有一双明亮的大眼睛，表情温柔又带一点自信，几缕头发自然地落在脸旁。镜头和她的眼睛平齐，脸部居中，背景虚化成柔和的奶油色光斑，用漫射的柔光照亮眼睛、睫毛和嘴唇，同时在头发边缘留一点细细的轮廓光，重点是高质量的二次元面部细节。"
