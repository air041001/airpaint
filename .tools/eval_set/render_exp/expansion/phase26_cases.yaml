  - id: E4
    category: lighting_texture
    input: "黄昏下的少女"
    detailed_input: "我想画一个少女在黄昏的空旷原野里安静地站着，身体略微侧向镜头，神情平静。天空是橙色和紫色交叠的暮色，低处的太阳在她的头发和肩膀边缘形成一圈暖色轮廓光，地面有很长的柔和影子，风吹动几缕散发。画面保持清晰的脸部细节，用薄薄的空气透视和柔和的二次元赛璐璐光影表现安静的傍晚。"
