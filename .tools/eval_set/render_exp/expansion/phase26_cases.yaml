    seed: 2705
  - id: E6
    category: nsfw_painter_quality
    input: "女性裸体躺在卧室的床上"
    detailed_input: "我想画一位裸体女性慵懒地躺在卧室的床上，黑色丝绸床单自然地搭在身体一部分，床铺有柔和的褶皱。她放松地看向镜头，身体采用优雅的三分之四构图，床边暖黄色台灯照出皮肤的细微高光，房间其他地方落在柔和的阴影里。画面保持克制而有张力的成人氛围，关注姿态、视线、丝绸材质和光影节奏，不增加其他人物或额外行为，使用细腻的二次元插画表现。"
    size: "832x1216"
    seed: 2706
  - id: E7
    category: mood_to_scene
    input: "孤独的氛围"
    detailed_input: "我想把孤独的氛围画成一个女孩独自坐在有雨痕的卧室窗边，膝盖收在身前，望着蓝调时刻空荡的街道。房间里有一张没有整理的床和旁边一杯没有动过的茶，身后留一盏很淡的暖灯，窗户的冷色反光落在她身上。画面让人物偏在一侧，另一侧留出大片安静的负空间，颜色克制偏冷，细雨、柔影和细腻线条共同表现安静的孤独感。"
